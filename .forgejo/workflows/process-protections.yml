name: process-protections

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
    keep-build-log = false

jobs:
  process-protections:
    runs-on: [k8s-executor-medium, amd64]
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require actual Guard and OS Sandbox tests in the offline Linux VM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/process-protections
          nix build --no-update-lock-file --print-build-logs \
            --out-link result .#checks.x86_64-linux.process-protections \
            2>&1 | tee test-results/process-protections/build.log
          cp -R result/. test-results/process-protections/
      - name: Upload actual protection VM logs
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d # v3-node20
        with:
          name: process-protections-logs
          path: test-results/process-protections/
          if-no-files-found: error
